name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541dca151540f13d2e5d7d0b2e1f13 # v4.0.4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm pack --dry-run

  packed-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541dca151540f13d2e5d7d0b2e1f13 # v4.0.4
        with:
          node-version: 24
      - run: npm ci
      - name: Pack and install locally
        shell: bash
        run: |
          package=$(npm pack --silent)
          test_dir=$(mktemp -d)
          npm install --prefix "$test_dir" "$PWD/$package"
          node -e "const api=require('$test_dir/node_modules/hotfiles'); if(typeof api.analyzeRepository!=='function') process.exit(1)"
          "$test_dir/node_modules/.bin/hotfiles" --version
